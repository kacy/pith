syntax = "proto3";

package echobench;

option go_package = "pithgrpcbench/echopb";

// a byte payload we can size up or down to stress serialization.
message EchoRequest {
  bytes payload = 1;
}

message EchoResponse {
  bytes payload = 1;
}

// unary plus the three streaming shapes, all echoing the payload — enough to
// exercise every grpc client mode against a server whose behavior is known.
service Echo {
  rpc Unary(EchoRequest) returns (EchoResponse);
  rpc ServerStream(EchoRequest) returns (stream EchoResponse);
  rpc ClientStream(stream EchoRequest) returns (EchoResponse);
  rpc BidiStream(stream EchoRequest) returns (stream EchoResponse);
}
