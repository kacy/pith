[package]
name = "zstd_codec_rust"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# pure rust decoder and encoder (the encoder only implements the fastest level)
ruzstd = "0.9.1"
# bindings to the c reference library, the same crate the pith kernel links
zstd = "0.13.3"

[profile.release]
opt-level = 3
