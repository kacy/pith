# standalone workspace so cargo does not fold this into the forge runtime
# workspace at the repo root.
[workspace]

[package]
name = "grpc-bench-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rustclient"
path = "src/main.rs"

[dependencies]
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[build-dependencies]
tonic-build = "0.12"
