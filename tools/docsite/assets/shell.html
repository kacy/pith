<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pith stdlib</title>
<meta name="description" content="Reference documentation for the pith standard library, generated from the source.">
<script>
// run before first paint: drop `no-js` so the single-module view applies
// without a flash of the whole document, and apply the saved theme.
document.documentElement.classList.remove("no-js");
try {
  var t = localStorage.getItem("pith-docs-theme");
  if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
} catch (e) { /* private mode */ }
</script>
<style>
<!--docsite:styles-->
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-head">
      <a class="brand" href="#"><span class="mark"></span>pith<span class="sub">stdlib</span></a>
      <button class="search-trigger" type="button">Search the stdlib<kbd>&#8984;K</kbd></button>
      <input class="nav-filter" type="search" placeholder="Filter modules" aria-label="Filter modules">
    </div>
    <nav class="nav" aria-label="Modules">
<!--docsite:nav-->
      <p class="empty-note" hidden>No modules match that filter.</p>
    </nav>
    <div class="sidebar-foot">
      <span><!--docsite:version--></span>
      <button class="theme-toggle" type="button">dark</button>
    </div>
  </aside>
  <main class="main">
    <div class="content">
<!--docsite:home-->
<!--docsite:modules-->
    </div>
  </main>
</div>

<div class="palette-backdrop" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Search the stdlib">
    <input type="search" placeholder="Search functions, types, and modules" autocomplete="off" spellcheck="false" aria-label="Search query">
    <ul class="palette-results" role="listbox"></ul>
    <p class="palette-empty" hidden></p>
    <div class="palette-foot">
      <span><kbd>&#8593;</kbd><kbd>&#8595;</kbd> navigate</span>
      <span><kbd>&#8629;</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<script>
<!--docsite:script-->
</script>
</body>
</html>
