# rust counterpart to bench/http_server_min.go. a standalone workspace so
# cargo does not fold this into the runtime workspace at the repo root.
[workspace]

[package]
name = "http_server_rustmin"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }

[profile.release]
opt-level = 3
