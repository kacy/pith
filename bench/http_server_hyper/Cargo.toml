# hyper counterpart to bench/http_server.go. a standalone workspace so cargo
# does not fold this into the runtime workspace at the repo root.
[workspace]

[package]
name = "http_server_hyper"
version = "0.1.0"
edition = "2021"

[dependencies]
form_urlencoded = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }

[profile.release]
opt-level = 3
