# rust counterpart to bench/hash_kernels.pith. a standalone workspace so
# cargo does not fold this into the runtime workspace at the repo root.
[workspace]

[package]
name = "hash_kernels_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
sha1 = "0.10"
sha2 = "0.10"
crc32fast = "1"
adler2 = "2"

[profile.release]
opt-level = 3
