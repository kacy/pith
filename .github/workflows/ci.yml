name: ci
on:
  push:
    branches: [main]
  pull_request:

# cancel an older in-flight run on the same PR when new commits land, while
# letting every push to main run to completion.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# nothing in ci writes to the repository, so its token is read-only.
permissions:
  contents: read

# the suite used to run sequentially in one 48-step `build` job that took
# 80 minutes on a fast runner and crossed the 120-minute timeout on slower
# runners. splitting it into parallel jobs keeps every job under ~25 minutes
# even on slow runners without dropping a single check.
jobs:
  core-and-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: cargo build --release

      - name: check rust crash guards
        run: make check-no-panics

      - name: check regression-case ports stay outside the ephemeral range
        run: make check-test-ports

      - name: check thread-local barriers in the runtime archive
        run: make check-tls-barriers

      - name: rust unit tests
        run: cargo test --release --workspace --locked

      - name: cycle gc world-stop tests
        run: make test-cycle-gc

      - name: loom models of the runtime's concurrency protocols
        run: make loom-check

      - name: test
        run: |
          ./target/release/pith run tests/cases/test_suite.pith
          ./target/release/pith run tests/cases/test_process_command.pith
          ./target/release/pith run tests/cases/test_http_request_bytes.pith

      - name: abort goldens
        run: make abort-goldens-only

      - name: run examples (native smoke)
        run: |
          ./target/release/pith run examples/hello.pith >/dev/null
          ./target/release/pith run examples/collection_methods.pith >/dev/null
          ./target/release/pith run examples/string_collection_methods.pith >/dev/null
          ./target/release/pith run examples/stdlib_algo.pith >/dev/null

      - name: green-thread runtime tests
        run: make green-tests

      - name: build self-hosted compiler and ir driver
        run: make self-host self-host-ir-driver

      - name: test runner goldens (native and self-hosted wrapper)
        run: make test-runner-goldens-only

      - name: invalid examples (checker diagnostics)
        run: make check-invalid-only

      - name: invalid parse examples (parser diagnostics)
        run: make check-parse-invalid-only

      - name: cli regressions
        run: make cli-regressions-only

      - name: colocated self-host unit tests
        run: make test-self-host-only

      - name: run examples (self-hosted)
        run: make run-examples-self

      - name: native parity examples
        run: make parity-examples-only

      - name: sitegen golden check
        run: make sitegen-check

      - name: lsp golden check
        run: make lsp-check-only

      - name: diagnostic position golden check
        run: make diag-check-only

      - name: compiler input limits check
        run: make input-limits-check-only

      - name: logscan golden check
        run: make logscan-check

      - name: apic golden check
        run: make apic-check

      - name: parq golden check
        run: make parq-check

      - name: protogen golden check
        run: make protogen-check

      - name: docsite golden check
        run: make docsite-check

      - name: purl unit and integration check
        run: make purl-check

      - name: gzip interop check
        run: make gzip-interop-check

      - name: zstd interop check
        run: make zstd-interop-check

      - name: pure-pith zstd decoder interop
        run: make zstd-pure-check

      - name: pure-pith zstd encoder interop
        run: make zstd-encode-check

      - name: tls live interop (openssl)
        run: make tls-live-interop

      - name: tls interop (go crypto/tls)
        run: make tls-go-interop

      - name: tls interop (rustls)
        run: make tls-rustls-interop

      - name: fuzz check
        run: make fuzz-check

      - name: parser surface fuzz check
        run: make fuzz-surfaces-check

      - name: pithgen check
        run: make pithgen-check

      - name: lint
        run: |
          # std/ is in here because its public api IS the documentation —
          # docsite generates from it, so a naming slip there ships to
          # readers rather than staying an internal wart.
          #
          # lint now fails on a WARNING, not only on a hard error. a file
          # that declares itself generated in its leading comment block is
          # skipped, since generated code mirrors the naming of whatever
          # produced it and is not ours to rename.
          #
          # tools/docsite/sample is golden-test INPUT rather than source:
          # docsite renders that tree and the output is diffed, so the
          # fixture deliberately contains an undocumented public function
          # to pin how an undocumented item renders. documenting it would
          # delete the case it exists to cover. a marker comment is no
          # good either — the file's leading `##` block IS the module doc
          # the golden captures.
          for f in $(find examples self-host std tools -name '*.pith' \
                          -not -path 'tools/docsite/sample/*' | sort); do
            ./self-host/pith_main lint "$f"
            if [ $? -ne 0 ]; then
              echo "FAIL lint $f"
              exit 1
            fi
          done

      - name: check examples (self-hosted)
        run: |
          for f in $(find examples -name '*.pith' | sort); do
            result=$(./self-host/pith_main check "$f" 2>&1)
            if [ "$result" != "ok" ]; then
              echo "FAIL $f (self-hosted check)"
              echo "$result"
              exit 1
            fi
            echo "ok   $f"
          done

      - name: check pith formatting
        run: |
          # std/ nests to std/net/http2, deeper than a `std/**/*.pith` glob
          # reaches without globstar, so the file list comes from find. the
          # two lsp fixtures are misformatted on purpose: the lsp tests format
          # them.
          for f in $(find self-host std tools tooling bench examples tests -name '*.pith' \
              -not -path tests/lsp/fixtures/misformat.pith \
              -not -path tests/lsp/fixtures/multibyte_misformat.pith | sort); do
            ./self-host/pith_main fmt --check "$f"
            if [ $? -ne 0 ]; then
              echo "FAIL $f not formatted"
              exit 1
            fi
          done

      - name: check doc coverage
        run: |
          # std/ nests to std/net/http2, deeper than a `std/**/*.pith` glob
          # reaches without globstar, so the file list comes from find.
          #
          # self-host/ joined this gate once its pub items were documented.
          # note the gate and lint's E304 cover DIFFERENT things and neither
          # subsumes the other: this walks top-level items including structs,
          # E304 also walks impl methods. a file can pass here and still warn.
          for f in $(find self-host std -name '*.pith' | sort); do
            ./self-host/pith_main doc --check "$f"
            if [ $? -ne 0 ]; then
              echo "FAIL $f missing doc comments"
              exit 1
            fi
          done

  # build the regression corpus executables once in parallel, then execute them
  # sequentially under green (default + 1 worker), shared-count checks
  # (PITH_RC_CHECK=1), and os threads (PITH_GREEN=0). all three switches are
  # pure runtime flags, so compiling once instead of five times tests the exact
  # same machine code and runtime paths while cutting corpus time ~7x.
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PITH_CORPUS_BIN_DIR: /tmp/pith-corpus-bins
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: cargo build --release

      - name: compile regression corpus once
        run: make build-corpus-bins-only

      - name: regression corpus under green
        run: make verify-green-corpus-only

      # a struct keeps plain counts until it can reach another task; this
      # aborts any case where a task touched a struct it did not build without
      # the struct having been marked shared
      - name: shared-count check over the green corpus
        run: make rc-check-only

      # the runner is linux, so every other step above already runs green by
      # default. this is the only step that exercises the PITH_GREEN=0 opt-out
      # across the corpus.
      - name: regression corpus under os threads
        run: make verify-osthread-corpus-only

  # the memcheck step below runs with valgrind's leak check off, because
  # the runtime's freelists and pools are still reachable at exit and
  # would bury a real signal. leak growth covers leaks instead, by measuring
  # growth across two round counts.
  leak-and-memcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: cargo build --release

      - name: leak growth
        run: make leak-check-only

      - name: memcheck
        # generous triple of the step's normal time (apt ~1min + the
        # curated suite ~8min): the observed wedges were apt-mirror stalls
        # that produced no output at all, so a hard cap converts hours of
        # silence into a fast, visible failure.
        timeout-minutes: 30
        run: |
          # the install is bounded and retried; see the script for why.
          tooling/ci_install_valgrind.sh
          make memcheck

  ir-and-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: cargo build --release

      - name: build self-hosted compiler
        run: make self-host

      - name: IR contract over the corpus
        run: make validate-ir-contract-only

      - name: count marks leave the IR unchanged and every count balances
        run: make count-marks-check-only

      - name: verify a fresh clone can bootstrap from the seed
        run: make smoke-bootstrap-seed

      - name: verify the tracked seed matches the emitter source
        run: make check-bootstrap-seed

      - name: verify bootstrap fixed point
        run: make bootstrap-verify

  # the two-register result abi is the default, so every job above runs it.
  # this one runs the regression corpus, the leak cases and the memcheck set
  # with it off (PITH_RESULT_REG=0), the box abi every `-> T!` function used
  # before. it runs beside the jobs above, so it adds no wall time.
  result-box:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: cargo build --release

      - name: regression corpus with the box result abi
        run: make run-regressions-result-box-only

      - name: leak growth with the box result abi
        run: make leak-check-result-box-only

      - name: memcheck with the box result abi
        timeout-minutes: 30
        run: |
          tooling/ci_install_valgrind.sh
          make memcheck-result-box
