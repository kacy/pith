syntax = "proto3";

package sample;

// the supported well-known-type imports; each type used below is synthesized
// into the generated module as a plain message (Timestamp, Int32Value, ...).
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

// a color, generated as named Int constants (Color_RED, ...).
enum Color {
  UNKNOWN = 0;
  RED = 1;
  GREEN = 2;
  BLUE = 3;
}

// a nested message, referenced by Shape below.
message Point {
  int32 x = 1;
  int32 y = 2;
}

// exercises scalars, an enum, a message field, and repeated fields.
message Shape {
  string name = 1;
  int32 id = 2;
  bool filled = 3;
  Color color = 4;
  Point center = 5;
  repeated Point vertices = 6;
  repeated int32 tags = 7;
  repeated string labels = 8;
  bytes blob = 9;
  double area = 10;
  sint32 offset = 11;
  float weight = 12;
}

// exercises the well-known types as fields: Timestamp and Duration, plus a
// wrapper (Int32Value) as the optional-int pattern.
message Event {
  string name = 1;
  google.protobuf.Timestamp at = 2;
  google.protobuf.Duration elapsed = 3;
  google.protobuf.Int32Value priority = 4;
}

// exercises oneof: each group becomes a payload enum plus constructor
// functions (Sticker_emoji, Sticker_anchor, ...). string, message, and enum
// members, and a second group in the same message.
message Sticker {
  string name = 1;
  oneof design {
    string emoji = 2;
    Point anchor = 3;
    Color tint = 4;
  }
  oneof backing {
    bool reusable = 5;
    int32 stock = 6;
  }
}

// exercises map fields: string and integer keys with scalar and message
// values. Bin is declared below Inventory on purpose, so the generator has
// to order the structs by dependency.
message Inventory {
  map<string, int32> counts = 1;
  map<string, Bin> bins = 2;
  map<int64, string> names = 3;
}

// a message used as a map value by Inventory above.
message Bin {
  int32 size = 1;
}

// exercises all four rpc shapes: unary, server-streaming, client-streaming,
// and bidirectional-streaming.
service Geometry {
  rpc Describe(Point) returns (Shape);
  rpc Corners(Shape) returns (stream Point);
  rpc Assemble(stream Point) returns (Shape);
  rpc Reflect(stream Point) returns (stream Point);
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}
